[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shakmaty = "0.30.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rand = "0.10.3"
zstd = "0.14.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
